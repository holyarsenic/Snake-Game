<!DOCTYPE html>
<html>

<head>
  <title>Snake Game</title>
  <link rel="stylesheet" href="snake.css" </head>

<body>
  <main>
    <section>
      <div class="infos">
        <div class="info">
          <h3>High Score:
            <span id="high-score">0</span>
          </h3>
        </div>
        <div class="info">
          <h3>Score:
            <span id="score">0</span>
          </h3>
        </div>
        <div class="info">
          <h3>Time:
            <span id="time">00-00</span>
          </h3>
        </div>
      </div>
      <div class="board">
      </div>


      <div class="game-controller">
        <div class="up controller">UP</div>
        <div class="down controller">DW</div>
        <div class="right controller">RG</div>
        <div class="left controller">LF</div>
      </div>

    </section>
    <div class="modal">
      <div class="start-game">
        <h3>Welcome to the Snake Game</h3>
        <button class="btn btn-start">start Game</button>
      </div>
      <div class="game-over">
        <h3>Game game-over</h3>
        <button class="btn btn-restart">Re-start Game</button>
      </div>
    </div>
  </main>
  <script src="snake.js"></script>
</body>

</html>
